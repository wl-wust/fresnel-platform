<!DOCTYPE html>

<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>菲涅耳双棱镜干涉实验 AI 数字化平台</title>

    <link rel="stylesheet" href="css/style.css?v=3.0">

    <script src="lib/chart.umd.min.js"></script>

</head>

<body>

    <div class="container">

        <header>

            <button class="btn-switch-mobile" onclick="switchToMobile()">切换到手机端</button>

            <h1>菲涅耳双棱镜干涉实验 AI 数字化平台</h1>

            <p>条纹识别 · 数据拟合 · 不确定度评定 · 多路径合成</p>

        <a href="optical_v2.html" class="btn-optical">🔭 光学模拟</a></header>

        <nav class="tabs">

            <button class="tab active" data-tab="analysis">图像分析</button>

            <button class="tab" data-tab="wavelength">波长计算</button>

            <button class="tab" data-tab="fit">数据拟合</button>

            <button class="tab" data-tab="uncertainty">不确定度</button>

            <button class="tab" data-tab="combine">多路径合成</button>

            <button class="tab" data-tab="history">历史记录</button>

        </nav>



        <div id="analysis" class="tab-content active">

            <h2>条纹图像分析</h2>

            <div class="analysis-layout">

                <div class="upload-area">

                    <input type="file" id="imageInput" accept="image/*">

                    <button onclick="analyzeImage()">开始分析</button>

                    <p class="hint">支持 JPG/PNG，建议条纹周期≥8像素</p>

                </div>

                <div class="result-panel" id="analysisResult"></div>

            </div>

            <div class="chart-container" id="fringeChartContainer" style="display:none">

                <canvas id="fringeChart"></canvas>

            </div>

        </div>



        <div id="wavelength" class="tab-content">

            <h2>波长计算</h2>

            <div class="calc-grid">

                <div class="calc-card">

                    <h3>基本公式法</h3>

                    <div class="form-group"><label>d (mm) 虚光源间距</label><input type="number" id="d_value" step="0.01" value="0.5"></div>

                    <div class="form-group"><label>D (mm) 观察距离</label><input type="number" id="D_value" step="1" value="500"></div>

                    <div class="form-group"><label>k (mm/px) 像素当量</label><input type="number" id="pixel_size" step="0.0001" value="0.008"></div>

                    <div class="form-group"><label>Δx (px) 条纹间距</label><input type="number" id="fringe_period_px" step="0.1" value="10"></div>

                    <button onclick="calcWavelength()">计算波长</button>

                    <div id="wavelengthResult" class="result-box"></div>

                </div>

                <div class="calc-card">

                    <h3>比值法</h3>

                    <div class="form-group"><label>激光条纹间距 (px)</label><input type="number" id="fringe_laser" step="0.1" value="12.5"></div>

                    <div class="form-group"><label>钠光条纹间距 (px)</label><input type="number" id="fringe_sodium" step="0.1" value="11.3"></div>

                    <div class="form-group"><label>激光波长 (nm)</label><input type="number" id="lambda_laser" step="1" value="650"></div>

                    <button onclick="calcRatioMethod()">比值法计算</button>

                    <div id="ratioResult" class="result-box"></div>

                </div>

                <div class="calc-card">

                    <h3>增强不确定度</h3>

                    <div class="form-group"><label>d (mm)</label><input type="number" id="unc_d_pc" step="0.01" value="0.5"></div>

                    <div class="form-group"><label>u(d) (mm)</label><input type="number" id="unc_u_d_pc" step="0.001" placeholder="默认0.2%"></div>

                    <div class="form-group"><label>D (mm)</label><input type="number" id="unc_D_pc" step="1" value="500"></div>

                    <div class="form-group"><label>u(D) (mm)</label><input type="number" id="unc_u_D_pc" step="0.1" placeholder="默认0.3%"></div>

                    <div class="form-group"><label>条纹间距 (px)</label><input type="number" id="unc_fringe_pc" step="0.1"></div>

                    <button onclick="calcUncertaintyPC()">计算不确定度</button>

                    <div id="enhancedUncResultPC" class="result-box"></div>

                </div>

            </div>

        </div>



        <div id="fit" class="tab-content">

            <h2>最小二乘拟合</h2>

            <div class="fit-layout">

                <div class="table-container">

                    <table id="fitTable">

                        <thead><tr><th>x</th><th>y</th><th>操作</th></tr></thead>

                        <tbody>

                            <tr><td><input type="number" step="any" class="fit-x"></td><td><input type="number" step="any" class="fit-y"></td><td><button onclick="removeFitRow(this)">删除</button></td></tr>

                            <tr><td><input type="number" step="any" class="fit-x"></td><td><input type="number" step="any" class="fit-y"></td><td><button onclick="removeFitRow(this)">删除</button></td></tr>

                            <tr><td><input type="number" step="any" class="fit-x"></td><td><input type="number" step="any" class="fit-y"></td><td><button onclick="removeFitRow(this)">删除</button></td></tr>

                        </tbody>

                    </table>

                    <button onclick="addFitRow()">+ 添加数据点</button>

                    <button onclick="performFitTable()">执行拟合</button>

                </div>

                <div id="fitResult" class="result-box"></div>

            </div>

            <div class="chart-container" id="fitChartContainer" style="display:none">

                <canvas id="fitChart"></canvas>

            </div>

        </div>



        <div id="uncertainty" class="tab-content">

            <h2>不确定度评定</h2>

            <div class="unc-layout">

                <div class="table-container">

                    <table id="uncTable">

                        <thead><tr><th>测量值 (nm)</th><th>操作</th></tr></thead>

                        <tbody>

                            <tr><td><input type="number" step="0.1" class="unc-value" placeholder="589.1"></td><td><button onclick="removeUncRow(this)">删除</button></td></tr>

                            <tr><td><input type="number" step="0.1" class="unc-value" placeholder="589.3"></td><td><button onclick="removeUncRow(this)">删除</button></td></tr>

                            <tr><td><input type="number" step="0.1" class="unc-value" placeholder="589.2"></td><td><button onclick="removeUncRow(this)">删除</button></td></tr>

                        </tbody>

                    </table>

                    <button onclick="addUncRow()">+ 添加测量值</button>

                    <button onclick="calcUncertaintyTable()">计算不确定度</button>

                </div>

                <div id="uncertaintyResult" class="result-box"></div>

            </div>

        </div>



        <div id="combine" class="tab-content">

            <h2>多路径加权合成</h2>

            <div class="combine-layout">

                <div class="table-container">

                    <table id="pathTable">

                        <thead><tr><th>路径名称</th><th>测量值 (nm)</th><th>不确定度</th><th>操作</th></tr></thead>

                        <tbody>

                            <tr><td><input type="text" class="path-name" placeholder="基本公式"></td><td><input type="number" step="0.1" class="path-value" placeholder="589.1"></td><td><input type="number" step="0.01" class="path-unc" placeholder="1.5"></td><td><button onclick="removePathRow(this)">删除</button></td></tr>

                            <tr><td><input type="text" class="path-name" placeholder="比值法"></td><td><input type="number" step="0.1" class="path-value" placeholder="589.3"></td><td><input type="number" step="0.01" class="path-unc" placeholder="1.2"></td><td><button onclick="removePathRow(this)">删除</button></td></tr>

                            <tr><td><input type="text" class="path-name" placeholder="棱镜偏折角"></td><td><input type="number" step="0.1" class="path-value" placeholder="589.0"></td><td><input type="number" step="0.01" class="path-unc" placeholder="2.0"></td><td><button onclick="removePathRow(this)">删除</button></td></tr>

                        </tbody>

                    </table>

                    <button onclick="addPathRow()">+ 添加路径</button>

                    <label>标准值(589.3nm): <input type="number" id="standard_value" value="589.3" step="0.1"></label>

                    <button onclick="comparePathsTable()">执行加权合成</button>

                </div>

                <div id="compareResult" class="result-box"></div>

            </div>

            <div class="chart-container" id="combineChartContainer" style="display:none">

                <canvas id="combineChart"></canvas>

            </div>

        </div>



        <div id="history" class="tab-content">

            <h2>历史记录</h2>

            <div class="history-controls">

                <button onclick="clearHistory()">清空记录</button>

                <button onclick="exportHistory()">导出记录</button>

            </div>

            <div id="historyList" class="history-list"></div>

        </div>

    </div>

    <script src="js/main.js?v=3.0"></script>

</body>

</html>
